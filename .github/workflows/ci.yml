name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -v --ignore=tests/e2e

  # TEC-02: recorrido completo en un navegador real
  e2e:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/e2e -v

  # Despliegue continuo: cada push a main que pasa las pruebas se publica en Azure.
  # Corre en un runner self-hosted instalado en la VM de Azure (no se abre SSH ni se guardan credenciales).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: [self-hosted, azure]
    concurrency: produccion
    steps:
      - name: Publicar en Azure (git pull, dependencias, reinicio y verificación de /api/salud)
        run: sudo /opt/gestion/actualizar.sh
